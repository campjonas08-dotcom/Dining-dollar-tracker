<title>Auburn Dining Dollars</title>

<style>
:root{
  --navy:#03244D;
  --navy-soft:#0A315C;
  --navy-light:#E8EEF5;
  --navy-dark:#021B38;
  --orange:#F26522;
  --orange-bright:#FF7A2F;
  --orange-light:#FFF0E7;
  --cream:#F7F8FA;
  --white:#FFFFFF;
  --card-line:#DDE4EC;
  --ink:#18212B;
  --muted:#65717D;
  --good:#2E7D4F;
  --bad:#C23B22;
  --track:#E7ECF1;
  --shadow: 0 8px 24px rgba(3,36,77,0.10);
  --radius:18px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy-light:#1B2A3E;
    --cream:#0B1420;
    --white:#141F2E;
    --card-line:#25344A;
    --ink:#EAF0F7;
    --muted:#8CA0B6;
    --track:#1E2C40;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ background:var(--cream); }
body{
  margin:0;
  min-height:100vh;
  background:var(--cream);
  background-image:
    radial-gradient(circle at 100% 0%, rgba(242,101,34,.08), transparent 32%),
    linear-gradient(180deg, var(--cream) 0%, var(--white) 120%);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding-bottom:48px;
  transition: background-color .2s ease, color .2s ease;
}
button, input{ font-family:inherit; }
button{ cursor:pointer; }

.wrap{ width:100%; max-width:480px; margin:0 auto; padding: calc(20px + env(safe-area-inset-top)) 18px 8px; }
.wrap::before{
  content:""; display:block; width:48px; height:4px; border-radius:999px;
  background: linear-gradient(90deg, var(--orange), var(--orange-bright));
  margin-bottom:16px;
}

.eyebrow{ font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--orange); font-weight:800; margin:0 0 4px 2px; }
h1{ font-size:24px; margin:0 0 18px 2px; font-weight:800; letter-spacing:-.025em; color:var(--navy); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) h1{ color:#EAF0F7; } }

.header-actions{ position:absolute; top: calc(22px + env(safe-area-inset-top)); right:18px; display:flex; gap:8px; z-index:2; }
.icon-btn{
  width:40px; height:40px; border-radius:50%; background:var(--navy-light);
  border: 1px solid rgba(3,36,77,.08);
  display:flex; align-items:center; justify-content:center;
  color:var(--navy);
  transition: transform .15s ease, background .15s ease;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .icon-btn{ color:#EAF0F7; border-color:#2c405c; } }
.icon-btn:active{ transform:scale(.92); background:#D7E2EE; }
.icon-btn svg{ width:18px; height:18px; display:block; }

/* Banners */
.banner{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 13px; border-radius:14px; font-size:12.5px; line-height:1.4;
  margin-bottom:10px; animation: fadeSlideIn .3s ease;
}
.banner b{ font-weight:800; }
.banner-x{ background:none; border:none; font-size:17px; line-height:1; color:inherit; opacity:.55; flex-shrink:0; padding:2px 4px; }
.banner-x:active{ opacity:1; }
.install-banner{ background:var(--navy-light); color:var(--navy); border:1px solid rgba(3,36,77,.10); }
.pro-banner{ background:var(--orange-light); color:#9c3d0f; border:1px solid rgba(242,101,34,.18); }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .install-banner{ color:#EAF0F7; border-color:#2c405c; }
  :root:not([data-theme="light"]) .pro-banner{ background:rgba(242,101,34,.14); color:#ffb37a; border-color:rgba(242,101,34,.25); }
}

.pro-chip{
  display:inline-flex; align-items:center; font-size:10px; font-weight:800; letter-spacing:.04em;
  color:white; background:linear-gradient(135deg,var(--orange),var(--orange-bright));
  padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; white-space:nowrap;
}
.active-chip{
  display:inline-flex; align-items:center; font-size:10px; font-weight:800; letter-spacing:.04em;
  color:white; background:var(--navy);
  padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; white-space:nowrap;
}

.budget-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px; scrollbar-width:none; }
.budget-tabs::-webkit-scrollbar{ display:none; }
.budget-tab{
  flex-shrink:0; padding:9px 16px; border-radius:999px; border:1px solid var(--card-line);
  background:var(--white); color:var(--ink); font-size:13px; font-weight:700; white-space:nowrap;
  transition: transform .1s ease;
}
.budget-tab:active{ transform:scale(.95); }
.budget-tab.active{ background:var(--navy); border-color:var(--navy); color:white; }
.budget-tab.add{ color:var(--orange); border-color:rgba(242,101,34,.35); border-style:dashed; background:transparent; }

.budget-list{ border:1px solid var(--card-line); border-radius:14px; overflow:hidden; background:var(--white); }
.budget-row{
  width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 15px; border:none; background:none; border-bottom:1px solid var(--card-line); text-align:left;
}
.budget-row:last-child{ border-bottom:none; }
.budget-row-name{ font-size:14px; font-weight:650; color:var(--ink); }
.budget-row-total{ font-size:13px; color:var(--muted); font-weight:650; flex-shrink:0; }

.card{
  position:relative; border-radius:23px; padding:23px 22px 20px;
  background: linear-gradient(135deg, #03244D 0%, #063568 52%, #0A447A 100%);
  color:white; box-shadow: 0 16px 38px rgba(3,36,77,.20);
  overflow:hidden; margin-bottom:16px;
}
.card::before{
  content:""; position:absolute; right:-45px; top:-70px; width:200px; height:200px;
  border-radius:50%; background: radial-gradient(circle, rgba(242,101,34,.48), transparent 70%);
}
.card::after{
  content:""; position:absolute; left:-80px; bottom:-100px; width:210px; height:210px;
  border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.06), transparent 70%);
}
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1; }
.chip-emblem{ width:35px; height:27px; border-radius:6px; background: linear-gradient(135deg, #FFD28F, #F26522); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.card-label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.72; margin-top:2px; }
.balance-num{ font-size:43px; font-weight:800; letter-spacing:-.025em; margin:10px 0 2px; position:relative; z-index:1; }
.balance-sub{ font-size:13px; opacity:.75; position:relative; z-index:1; }
.card-bottom{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:19px; position:relative; z-index:1; }
.card-bottom .field{ font-size:12px; opacity:.7; }
.card-bottom .field b{ display:block; font-size:15px; font-weight:650; opacity:1; color:white; margin-top:2px; }

.allowance, .stat, .progress-wrap, .history{ background:var(--white); border: 1px solid var(--card-line); box-shadow:var(--shadow); }

.allowance{ border-radius:var(--radius); padding:20px; margin-bottom:14px; }
.allowance-top{ display:flex; justify-content:space-between; align-items:center; }
.allowance-label{ font-size:13px; color:var(--muted); font-weight:700; }
.allowance-num{ font-size:40px; font-weight:800; color:var(--orange); margin:6px 0 2px; letter-spacing:-.025em; }
.allowance-sub{ font-size:13px; color:var(--muted); }
.allowance-note{
  display:inline-flex; align-items:center; margin-top:10px; padding:5px 9px; border-radius:999px;
  background:var(--orange-light); color:var(--orange); font-size:11px; font-weight:800;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .allowance-note{ background:rgba(242,101,34,.16); } }

.pace-card{
  display:flex; align-items:center; gap:12px; border-radius:14px; padding:13px 15px;
  margin-bottom:14px; font-size:13px; line-height:1.4; border:1px solid transparent;
}
.pace-card.pace-good{ background:rgba(46,125,79,.09); color:#1f5c3a; border-color:rgba(46,125,79,.16); }
.pace-card.pace-bad{ background:rgba(194,59,34,.09); color:var(--bad); border-color:rgba(194,59,34,.16); }
.pace-icon{ font-size:19px; flex-shrink:0; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .pace-card.pace-good{ color:#7fd8a4; }
  :root:not([data-theme="light"]) .pace-card.pace-bad{ color:#ff8a70; }
}

.stat-row{ display:flex; gap:12px; margin-bottom:14px; }
.stat{ flex:1; border-radius:14px; padding:15px; text-align:center; }
.stat .n{ font-size:22px; font-weight:750; color:var(--navy); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stat .n{ color:#EAF0F7; } }
.stat .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

.progress-wrap{ border-radius:14px; padding:16px; margin-bottom:18px; }
.progress-head{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:8px; }
.bar{ height:8px; background:var(--track); border-radius:999px; overflow:hidden; }
.bar-fill{ height:100%; background: linear-gradient(90deg, var(--orange), var(--orange-bright)); border-radius:999px; transition: width .4s ease; }

.actions{ display:flex; gap:10px; margin-bottom:12px; }
.btn{ flex:1; padding:14px 10px; border-radius:14px; border:none; font-size:14px; font-weight:750; transition: transform .12s ease, opacity .12s ease; }
.btn:active{ transform:scale(.97); opacity:.9; }
.btn-primary{ background: linear-gradient(135deg, #F26522, #DD4F12); color:white; box-shadow: 0 6px 16px rgba(242,101,34,.25); }
.btn-secondary{ background:var(--navy-light); color:var(--navy); border: 1px solid rgba(3,36,77,.08); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn-secondary{ color:#EAF0F7; border-color:#2c405c; } }
.btn-danger{ background:linear-gradient(135deg,#E0503A,#C23B22); color:white; box-shadow:0 6px 16px rgba(194,59,34,.25); }

.btn-wide{ width:100%; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:18px; }

.history{ border-radius:var(--radius); padding:16px 18px; }
.history h3{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
.hrow{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom: 1px solid var(--card-line); font-size:13.5px; gap:10px; }
.hrow:last-child{ border-bottom:none; }
.hrow .left{ display:flex; align-items:center; min-width:0; }
.hrow .left span.label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrow .right{ text-align:right; flex-shrink:0; }
.hrow .d{ color:var(--muted); font-size:12px; }
.hcat{
  display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
  border-radius:50%; background:var(--navy-light); font-size:12px; margin-right:9px; flex-shrink:0;
}
.empty{ color:var(--muted); font-size:13px; padding:6px 0; }

.overlay{
  position:fixed; inset:0; background: rgba(3,36,77,.48);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  animation: fadeIn .18s ease;
}
.sheet{
  position:relative; background:var(--cream); width:100%; max-width:480px;
  border-radius: 22px 22px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto;
  animation: slideUp .22s cubic-bezier(.2,.8,.2,1);
}
.sheet.center{ border-radius:22px; margin-top:auto; margin-bottom:auto; width:calc(100% - 24px); }
.sheet h2{ margin:0 0 4px; font-size:19px; color:var(--navy); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sheet h2{ color:#EAF0F7; } }
.sheet p.hint{ margin:0 0 16px; font-size:13px; color:var(--muted); }

label{ display:block; font-size:12px; font-weight:650; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
input[type=number], input[type=date], input[type=text]{
  width:100%; padding:12px 14px; border-radius:12px; border: 1px solid var(--card-line);
  font-size:16px; background:var(--white); font-family:inherit; color:var(--ink); outline:none;
}
input:focus{ border-color:var(--orange); box-shadow: 0 0 0 3px rgba(242,101,34,.12); }
.row2{ display:flex; gap:10px; }
.row2 > div{ flex:1; }

.chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
.chip{
  padding:8px 12px; border-radius:999px; border:1px solid var(--card-line); background:var(--white);
  font-size:12.5px; font-weight:650; color:var(--ink); transition: transform .1s ease, background .1s ease;
}
.chip:active{ transform:scale(.94); }
.qa-chip{ color:var(--orange); border-color:rgba(242,101,34,.3); font-weight:800; }
.qa-chip:active{ background:var(--orange-light); }
.cat-chip.active{ background:var(--navy); border-color:var(--navy); color:white; }

.section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:20px 0 10px; display:flex; align-items:center; }

.bar-row{ display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:10px; }
.bar-row-label{ width:76px; flex-shrink:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track{ flex:1; height:8px; background:var(--track); border-radius:999px; overflow:hidden; }
.bar-track-fill{ height:100%; background:linear-gradient(90deg,var(--orange),var(--orange-bright)); border-radius:999px; transition:width .4s ease; }
.bar-row-amt{ width:86px; text-align:right; flex-shrink:0; font-weight:650; color:var(--ink); }

.tool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px; }
.tool-btn{ font-size:12.5px; padding:12px 8px; }

.sheet-actions{ display:flex; gap:10px; margin-top:22px; }
.sheet-actions .btn{ padding:14px; }
.close-x{ position:absolute; top:14px; right:16px; background:none; border:none; font-size:22px; color:var(--muted); padding:4px 8px; }
.link{ display:block; background:none; border:none; color:var(--bad); font-size:12px; text-decoration:underline; padding:0; margin:16px auto 0; }
.note{ font-size:11.5px; color:var(--muted); background: rgba(242,101,34,.08); border-radius:10px; padding:10px 12px; margin-top:14px; line-height:1.4; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .note{ background: rgba(242,101,34,.14); } }

.tut-track{
  display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  margin:0 -20px; scrollbar-width:none;
}
.tut-track::-webkit-scrollbar{ display:none; }
.tut-slide{ flex:0 0 100%; scroll-snap-align:center; padding:8px 26px 4px; text-align:center; }
.tut-emoji{ font-size:56px; margin-bottom:14px; }
.tut-slide h2{ text-align:center; }
.tut-slide p{ text-align:center; }
.tut-dots{ display:flex; justify-content:center; gap:7px; margin-top:16px; }
.tut-dot{ width:7px; height:7px; border-radius:50%; background:var(--card-line); transition:background .2s ease, width .2s ease; }
.tut-dot.active{ background:var(--orange); width:18px; border-radius:999px; }

.toast{
  position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); background:var(--navy); color:white;
  font-size:13px; font-weight:650; padding:11px 18px; border-radius:999px; box-shadow:0 10px 26px rgba(3,36,77,.3);
  opacity:0; transition: opacity .25s ease, transform .25s ease; z-index:90; max-width:88%; text-align:center;
  pointer-events:none;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

.loading{ display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--muted); font-size:14px; }

@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
@keyframes slideUp{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }

@media(max-width:380px){
  .balance-num{ font-size:38px; }
  .allowance-num{ font-size:36px; }
  .card{ padding:20px; }
  .bar-row-label{ width:58px; }
  .bar-row-amt{ width:70px; }
}
</style>
</head>

<div id="app">

<script>
/* =========================================================
   AUBURN DINING DOLLARS TRACKER — FALL 2026
   Persistent storage: localStorage
   Semester: August 17, 2026 → December 11, 2026
   No class: Sep 7, Oct 8–9, Nov 23–27 (weekends auto-excluded)
   Includes Pro-tier tools (Insights, categories, quick-log presets,
   pace targeting, multiple budgets, a swipeable tutorial, a
   shareable stats-card image, and CSV/backup export & restore) —
   unlocked for this build.
   ========================================================= */

const CONFIG_KEY = 'auburn_dining_dollars_config_v4';
const LEGACY_CONFIG_KEY = 'auburn_dining_dollars_config_v3';
const LEGACY_HISTORY_KEY = 'auburn_dining_dollars_history_v3';

const CATEGORIES = [
  { key:'meal',    label:'Meal',      emoji:'🍽️', color:'#F26522' },
  { key:'coffee',  label:'Coffee',    emoji:'☕', color:'#8B5E34' },
  { key:'snack',   label:'Snack',     emoji:'🍪', color:'#D9A441' },
  { key:'grocery', label:'Groceries', emoji:'🛒', color:'#2E7D4F' },
  { key:'vending', label:'Vending',   emoji:'🥤', color:'#3B6EA5' },
  { key:'other',   label:'Other',     emoji:'🧾', color:'#65717D' }
];

const DEFAULTS = {
  totalBudget:475,
  semesterStart:'2026-08-17',
  semesterEnd:'2026-12-11',
  holidays:[
    '2026-09-07',
    '2026-10-08','2026-10-09',
    '2026-11-23','2026-11-24','2026-11-25','2026-11-26','2026-11-27'
  ],
  quickAmounts:[5,8,12,15]
};

const TUTORIAL_SLIDES = [
  {
    emoji:'🌱',
    title:'Earned so far',
    body:"Your budget doesn't arrive all at once — it accrues a little on every class day. This is how much has “unlocked” so far."
  },
  {
    emoji:'🎯',
    title:'Available to spend',
    body:"Earned so far, minus what you've logged as spent. Stay under this number and you're on pace to make it to December 11."
  },
  {
    emoji:'💳',
    title:'Balance',
    body:"Your actual Dining Dollars balance from the dining office. It only changes when you log a purchase, or update it here to match the real account."
  }
];

let config = null;

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0,10);
}

function fmtDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function fmtMoney(n){
  if(typeof n !== 'number' || !isFinite(n)){ n = 0; }
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function slugify(str){
  return String(str).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'budget';
}

function schoolDays(cfg){
  const days = [];
  const [sy,sm,sd] = cfg.semesterStart.split('-').map(Number);
  const [ey,em,ed] = cfg.semesterEnd.split('-').map(Number);
  let cur = new Date(sy, sm - 1, sd);
  const end = new Date(ey, em - 1, ed);
  const holidaySet = new Set(cfg.holidays);
  while(cur <= end){
    const dow = cur.getDay();
    const iso = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
    if(dow !== 0 && dow !== 6 && !holidaySet.has(iso)){
      days.push(iso);
    }
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

/* ---------- Budgets (Pro: multiple budgets) ---------- */
function makeBudgetId(){
  return 'b-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function makeBudget(overrides){
  return Object.assign({
    id: makeBudgetId(),
    name: 'Dining Dollars',
    totalBudget: DEFAULTS.totalBudget,
    balance: null,
    quickAmounts:[...DEFAULTS.quickAmounts],
    history:[]
  }, overrides || {});
}

function cloneDefaults(){
  const budget = makeBudget({ id:'dining-dollars', name:'Dining Dollars' });
  return {
    semesterStart: DEFAULTS.semesterStart,
    semesterEnd: DEFAULTS.semesterEnd,
    holidays:[...DEFAULTS.holidays],
    setupComplete:false,
    proBannerDismissed:false,
    installBannerDismissed:false,
    tutorialSeen:false,
    activeBudgetId: budget.id,
    budgets:[budget]
  };
}

function activeBudget(){
  return config.budgets.find(b => b.id === config.activeBudgetId) || config.budgets[0];
}

function saveConfig(){
  try{
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    return true;
  }catch(e){
    console.error('Could not save config:', e);
    return false;
  }
}

/* One-time upgrade from the single-budget release (config_v3 + history_v3)
   into the multi-budget shape, so existing balances/history survive. */
function migrateLegacy(){
  try{
    const legacyConfigRaw = localStorage.getItem(LEGACY_CONFIG_KEY);
    if(!legacyConfigRaw) return null;
    const legacy = JSON.parse(legacyConfigRaw);

    let legacyHistory = [];
    try{
      const legacyHistoryRaw = localStorage.getItem(LEGACY_HISTORY_KEY);
      legacyHistory = legacyHistoryRaw ? JSON.parse(legacyHistoryRaw) : [];
    }catch(e){ legacyHistory = []; }
    if(!Array.isArray(legacyHistory)){ legacyHistory = []; }

    const budget = makeBudget({
      id:'dining-dollars',
      name:'Dining Dollars',
      totalBudget: (typeof legacy.totalBudget === 'number' && legacy.totalBudget > 0) ? legacy.totalBudget : DEFAULTS.totalBudget,
      balance: legacy.balance,
      quickAmounts: (Array.isArray(legacy.quickAmounts) && legacy.quickAmounts.length) ? legacy.quickAmounts : [...DEFAULTS.quickAmounts],
      history: legacyHistory
    });

    return {
      semesterStart: DEFAULTS.semesterStart,
      semesterEnd: DEFAULTS.semesterEnd,
      holidays:[...DEFAULTS.holidays],
      setupComplete: !!legacy.setupComplete,
      proBannerDismissed: !!legacy.proBannerDismissed,
      installBannerDismissed: !!legacy.installBannerDismissed,
      /* Existing users already know the app — don't interrupt them with the tutorial. */
      tutorialSeen: !!legacy.setupComplete,
      activeBudgetId: budget.id,
      budgets:[budget]
    };
  }catch(e){
    console.error('Legacy migration failed:', e);
    return null;
  }
}

function normalizeConfig(){
  if(!Array.isArray(config.holidays)){
    config.holidays = [...DEFAULTS.holidays];
  }else{
    DEFAULTS.holidays.forEach(date => { if(!config.holidays.includes(date)){ config.holidays.push(date); } });
  }
  /* Always lock the semester to Fall 2026. */
  config.semesterStart = DEFAULTS.semesterStart;
  config.semesterEnd = DEFAULTS.semesterEnd;

  if(typeof config.setupComplete !== 'boolean'){ config.setupComplete = false; }
  if(typeof config.proBannerDismissed !== 'boolean'){ config.proBannerDismissed = false; }
  if(typeof config.installBannerDismissed !== 'boolean'){ config.installBannerDismissed = false; }
  if(typeof config.tutorialSeen !== 'boolean'){ config.tutorialSeen = false; }

  if(!Array.isArray(config.budgets) || !config.budgets.length){
    config.budgets = [makeBudget({ id:'dining-dollars', name:'Dining Dollars' })];
  }
  config.budgets.forEach(b => {
    if(!b.id){ b.id = makeBudgetId(); }
    if(typeof b.name !== 'string' || !b.name.trim()){ b.name = 'Dining Dollars'; }
    if(typeof b.totalBudget !== 'number' || !isFinite(b.totalBudget) || b.totalBudget <= 0){ b.totalBudget = DEFAULTS.totalBudget; }
    if(b.balance === undefined){ b.balance = null; }
    if(b.balance !== null && (typeof b.balance !== 'number' || !isFinite(b.balance))){ b.balance = 0; }
    if(!Array.isArray(b.quickAmounts) || !b.quickAmounts.length){ b.quickAmounts = [...DEFAULTS.quickAmounts]; }
    if(!Array.isArray(b.history)){ b.history = []; }
  });
  if(!config.budgets.find(b => b.id === config.activeBudgetId)){
    config.activeBudgetId = config.budgets[0].id;
  }
}

function loadState(){
  let raw = null;
  try{ raw = localStorage.getItem(CONFIG_KEY); }catch(e){ raw = null; }

  if(raw){
    try{ config = JSON.parse(raw); }
    catch(e){ console.error('Config loading error:', e); config = null; }
  }

  if(!config){
    config = migrateLegacy() || cloneDefaults();
  }

  normalizeConfig();
}

/* Total eligible class days is a fixed number — not derived from the
   semester date range. The start/end dates below are only used to figure
   out how many class days have passed as of today; they don't drive the total. */
const TOTAL_CLASS_DAYS = 72;

function computeStats(budget){
  budget = budget || activeBudget();
  const days = schoolDays(config);
  const today = todayISO();
  const totalDays = TOTAL_CLASS_DAYS;

  const earnedDays = days.filter(d => d <= today).slice(0, totalDays);
  const elapsedDays = earnedDays.length;

  const dayIndex = days.indexOf(today);
  const dayOfClass = (dayIndex >= 0 && dayIndex < totalDays) ? dayIndex + 1 : null;

  const remainingCount = Math.max(0, totalDays - elapsedDays);

  const totalBudget = Number(budget.totalBudget) || 0;
  const dailyRate = totalDays > 0 ? totalBudget / totalDays : 0;

  const accumulatedAllowance = dailyRate * elapsedDays;

  const totalSpent = budget.history.reduce((total, entry) => {
    const countsAsSpend = entry && (entry.type === 'spend' || entry.type === 'setup');
    if(countsAsSpend && typeof entry.amount === 'number' && isFinite(entry.amount)){
      return total + entry.amount;
    }
    return total;
  }, 0);

  const availableToSpend = accumulatedAllowance - totalSpent;

  const balance = Number(budget.balance) || 0;

  return {
    budget, days, today, totalDays, earnedDays, elapsedDays, remainingCount,
    dayOfClass, dailyRate, accumulatedAllowance, totalSpent, availableToSpend,
    balance, totalBudget, isClassToday: dayIndex >= 0
  };
}

/* ---------- Pro: today's pace target ---------- */
function computeTodayTarget(s){
  if(s.availableToSpend <= 0) return null;
  const divisor = Math.max(1, s.remainingCount + (s.isClassToday ? 1 : 0));
  return s.availableToSpend / divisor;
}

/* ---------- Pro: insights (weekly trend, category mix, projection) ---------- */
function mondayOf(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = (dt.getDay() + 6) % 7;
  dt.setDate(dt.getDate() - dow);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}

function computeInsights(budget){
  budget = budget || activeBudget();
  const s = computeStats(budget);

  const weekTotals = {};
  budget.history.forEach(h => {
    if(!h || h.type !== 'spend' || typeof h.amount !== 'number') return;
    const key = mondayOf(h.date);
    weekTotals[key] = (weekTotals[key] || 0) + h.amount;
  });
  const weekKeys = Object.keys(weekTotals).sort().slice(-6);
  const maxWeek = Math.max(1, ...weekKeys.map(k => weekTotals[k]));

  const catTotals = {};
  budget.history.forEach(h => {
    if(!h || typeof h.amount !== 'number') return;
    if(h.type !== 'spend' && h.type !== 'setup') return;
    const key = h.category || 'other';
    catTotals[key] = (catTotals[key] || 0) + h.amount;
  });
  const catEntries = Object.entries(catTotals).sort((a,b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...catEntries.map(e => e[1]));

  const avgPerClassDay = s.elapsedDays > 0 ? s.totalSpent / s.elapsedDays : 0;

  let projection;
  if(s.elapsedDays === 0){
    projection = { status:'none' };
  }else if(avgPerClassDay <= s.dailyRate + 0.005){
    projection = { status:'good', projectedLeftover: s.totalBudget - (avgPerClassDay * s.totalDays) };
  }else{
    const daysUntilExhausted = avgPerClassDay > 0 ? s.balance / avgPerClassDay : Infinity;
    const futureDays = s.days.filter(d => d > s.today);
    const idx = Math.min(futureDays.length - 1, Math.max(0, Math.floor(daysUntilExhausted) - 1));
    const runOutDate = (isFinite(daysUntilExhausted) && futureDays.length) ? futureDays[idx] : null;
    projection = { status:'warn', runOutDate, avgPerClassDay };
  }

  return { s, weekKeys, weekTotals, maxWeek, catEntries, maxCat, avgPerClassDay, projection };
}

/* ---------- Pro: export / share / backup ---------- */
function csvEscape(v){
  const str = String(v);
  return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

function toCSV(budget){
  budget = budget || activeBudget();
  const header = ['date','type','category','amount','balance_after'];
  const rows = budget.history.map(h => [
    h.date || '',
    h.type || '',
    h.category || '',
    (typeof h.amount === 'number' ? h.amount.toFixed(2) : ''),
    (typeof h.balanceAfter === 'number' ? h.balanceAfter.toFixed(2) : '')
  ]);
  return [header, ...rows].map(r => r.map(csvEscape).join(',')).join('\n');
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCSV(){
  const budget = activeBudget();
  downloadBlob(toCSV(budget), `dining-dollars-${slugify(budget.name)}-history.csv`, 'text/csv');
  showToast('History exported as CSV');
}

function exportBackup(){
  const payload = JSON.stringify({ version:2, exportedAt: todayISO(), config }, null, 2);
  downloadBlob(payload, 'dining-dollars-backup.json', 'application/json');
  showToast('Backup file downloaded');
}

async function shareSummary(){
  const budget = activeBudget();
  const s = computeStats(budget);
  const text = `${budget.name} — ${fmtDate(s.today)}\n` +
    `Balance: ${fmtMoney(s.balance)}\n` +
    `Available to spend: ${fmtMoney(s.availableToSpend)}\n` +
    `Class days completed: ${s.elapsedDays}/${s.totalDays}`;

  if(navigator.share){
    try{ await navigator.share({ title: `${budget.name} summary`, text }); }
    catch(e){ /* user cancelled the share sheet — nothing to do */ }
  }else if(navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(text);
      showToast('Summary copied to clipboard');
    }catch(e){
      await showAlert(text);
    }
  }else{
    await showAlert(text);
  }
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try{
      data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || !data.config || typeof data.config !== 'object'){
        throw new Error('Unrecognized backup format');
      }
    }catch(e){
      await showAlert("That file doesn't look like a valid Dining Dollars backup.");
      return;
    }

    const ok = await showConfirm(
      'This will replace your current budgets, settings, and history with the contents of this backup file.',
      { title:'Restore backup?', okLabel:'Restore' }
    );
    if(!ok) return;

    let restored;
    if(Array.isArray(data.config.budgets) && data.config.budgets.length){
      /* v2+ backup — already in the multi-budget shape. */
      restored = data.config;
    }else{
      /* v1 backup from the earlier single-budget release. */
      const legacyHistory = Array.isArray(data.history) ? data.history : [];
      const budget = makeBudget({
        id:'dining-dollars',
        name:'Dining Dollars',
        totalBudget: (typeof data.config.totalBudget === 'number' && data.config.totalBudget > 0) ? data.config.totalBudget : DEFAULTS.totalBudget,
        balance: data.config.balance,
        quickAmounts: (Array.isArray(data.config.quickAmounts) && data.config.quickAmounts.length) ? data.config.quickAmounts : [...DEFAULTS.quickAmounts],
        history: legacyHistory
      });
      restored = {
        setupComplete: !!data.config.setupComplete,
        proBannerDismissed: !!data.config.proBannerDismissed,
        installBannerDismissed: !!data.config.installBannerDismissed,
        tutorialSeen: true,
        activeBudgetId: budget.id,
        budgets:[budget]
      };
    }

    config = restored;
    normalizeConfig();
    saveConfig();

    document.querySelectorAll('.overlay').forEach(o => o.remove());
    showToast('Backup restored');
    render();
  };
  reader.readAsText(file);
}

/* ---------- Pro: shareable budget-card image ---------- */
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitFontSize(ctx, text, weight, font, maxWidth, startSize, minSize){
  let size = startSize;
  while(size > minSize){
    ctx.font = `${weight} ${size}px ${font}`;
    if(ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  }
  return size;
}

function drawBudgetCard(budget, s){
  const W = 1080, H = 1080;
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#03244D');
  bg.addColorStop(0.55, '#063568');
  bg.addColorStop(1, '#0A447A');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W - 40, 40, 20, W - 40, 40, 460);
  glow.addColorStop(0, 'rgba(242,101,34,.55)');
  glow.addColorStop(1, 'rgba(242,101,34,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.textBaseline = 'alphabetic';

  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.font = `700 30px ${FONT}`;
  ctx.fillText('AUBURN UNIVERSITY · FALL 2026', 70, 120);

  const nameSize = fitFontSize(ctx, budget.name, 800, FONT, W - 140, 56, 30);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = `800 ${nameSize}px ${FONT}`;
  ctx.fillText(budget.name, 70, 195);

  ctx.fillStyle = 'rgba(255,255,255,.68)';
  ctx.font = `700 26px ${FONT}`;
  ctx.fillText('AVAILABLE TO SPEND', 70, 360);

  const amountText = (s.availableToSpend < 0 ? '−' : '') + fmtMoney(Math.abs(s.availableToSpend));
  const amtSize = fitFontSize(ctx, amountText, 800, FONT, W - 132, 128, 64);
  ctx.fillStyle = s.availableToSpend < 0 ? '#FF8A70' : '#FF9A52';
  ctx.font = `800 ${amtSize}px ${FONT}`;
  ctx.fillText(amountText, 66, 490);

  const chips = [
    { label:'BALANCE', value: fmtMoney(s.balance) },
    { label:'SPENT', value: fmtMoney(s.totalSpent) },
    { label:'DAYS LEFT', value: String(s.remainingCount) }
  ];
  const chipGap = 24;
  const chipW = (W - 140 - chipGap * 2) / 3;
  const chipY = 560;
  const chipH = 150;
  chips.forEach((c, i) => {
    const x = 70 + i * (chipW + chipGap);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    roundRectPath(ctx, x, chipY, chipW, chipH, 20);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.font = `700 20px ${FONT}`;
    ctx.fillText(c.label, x + 24, chipY + 46);

    const valSize = fitFontSize(ctx, c.value, 800, FONT, chipW - 48, 40, 22);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `800 ${valSize}px ${FONT}`;
    ctx.fillText(c.value, x + 24, chipY + 100);
  });

  const barX = 70, barY = 790, barW = W - 140, barH = 18;
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  roundRectPath(ctx, barX, barY, barW, barH, 9);
  ctx.fill();

  const pct = s.totalDays > 0 ? Math.max(0, Math.min(1, s.elapsedDays / s.totalDays)) : 0;
  const fillGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  fillGrad.addColorStop(0, '#F26522');
  fillGrad.addColorStop(1, '#FF7A2F');
  ctx.fillStyle = fillGrad;
  roundRectPath(ctx, barX, barY, Math.max(barH, barW * pct), barH, 9);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.font = `600 24px ${FONT}`;
  ctx.fillText(`${s.elapsedDays} of ${s.totalDays} class days completed`, barX, barY + 56);

  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.font = `500 22px ${FONT}`;
  ctx.fillText(`Tracked with my Dining Dollars app · ${fmtDate(s.today)}`, 70, H - 60);

  return canvas;
}

async function shareBudgetCardImage(budget, s){
  budget = budget || activeBudget();
  s = s || computeStats(budget);
  const canvas = drawBudgetCard(budget, s);

  canvas.toBlob(async (blob) => {
    if(!blob){ showToast("Couldn't generate the image"); return; }
    const filename = `dining-dollars-${slugify(budget.name)}.png`;
    const file = new File([blob], filename, { type:'image/png' });

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{ await navigator.share({ files:[file], title: `${budget.name} — Dining Dollars` }); }
      catch(e){ /* user cancelled the share sheet */ }
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    showToast('Image saved');
  }, 'image/png', 0.95);
}

/* ---------- Home-screen install detection (Safari on iOS) ---------- */
function isStandalone(){
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function isIOS(){
  return /iP(hone|od|ad)/.test(navigator.platform || '') ||
    (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
}
function isSafariBrowser(){
  const ua = navigator.userAgent || '';
  return /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
}
function shouldShowInstallBanner(){
  return isIOS() && isSafariBrowser() && !isStandalone() && !config.installBannerDismissed;
}

/* ---------- Lightweight in-app dialogs (replace native alert/confirm) ---------- */
function showAlert(message){
  return new Promise(resolve => {
    const ov = overlay(`
      <h2>Heads up</h2>
      <p class="hint">${escapeHtml(message)}</p>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="alert-ok" style="flex:1;">OK</button>
      </div>
    `);
    document.getElementById('alert-ok').onclick = () => { ov.remove(); resolve(); };
  });
}

function showConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve => {
    const ov = overlay(`
      <h2>${escapeHtml(opts.title || 'Please confirm')}</h2>
      <p class="hint">${escapeHtml(message)}</p>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="cf-cancel">Cancel</button>
        <button class="btn ${opts.danger ? 'btn-danger' : 'btn-primary'}" id="cf-ok">${escapeHtml(opts.okLabel || 'Confirm')}</button>
      </div>
    `);
    const finish = (val) => { ov.remove(); resolve(val); };
    document.getElementById('cf-cancel').onclick = () => finish(false);
    document.getElementById('cf-ok').onclick = () => finish(true);
    ov.addEventListener('click', e => { if(e.target === ov){ finish(false); } });
  });
}

function showToast(message){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 2200);
}

/* ---------- Pro: swipeable "how this works" tutorial ---------- */
function showTutorial(){
  let index = 0;

  const slidesHtml = TUTORIAL_SLIDES.map(sl => `
    <div class="tut-slide">
      <div class="tut-emoji">${sl.emoji}</div>
      <h2>${escapeHtml(sl.title)}</h2>
      <p class="hint" style="margin-bottom:0;">${escapeHtml(sl.body)}</p>
    </div>
  `).join('');

  const ov = overlay(`
    <button class="close-x" id="close-tutorial">×</button>
    <div class="tut-track" id="tut-track">${slidesHtml}</div>
    <div class="tut-dots" id="tut-dots">${TUTORIAL_SLIDES.map((_, i) => `<span class="tut-dot${i === 0 ? ' active' : ''}"></span>`).join('')}</div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="tut-back" style="visibility:hidden;">Back</button>
      <button class="btn btn-primary" id="tut-next">Next</button>
    </div>
  `);

  const track = document.getElementById('tut-track');
  const backBtn = document.getElementById('tut-back');
  const nextBtn = document.getElementById('tut-next');
  const dots = () => Array.from(ov.querySelectorAll('.tut-dot'));

  function syncControls(){
    dots().forEach((d, di) => d.classList.toggle('active', di === index));
    backBtn.style.visibility = index === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = index === TUTORIAL_SLIDES.length - 1 ? 'Got it' : 'Next';
  }

  function finish(){
    config.tutorialSeen = true;
    saveConfig();
    ov.remove();
  }

  function goTo(i){
    index = Math.max(0, Math.min(TUTORIAL_SLIDES.length - 1, i));
    track.scrollTo({ left: index * track.clientWidth, behavior:'smooth' });
    syncControls();
  }

  let scrollTimer;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      index = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      syncControls();
    }, 80);
  });

  backBtn.onclick = () => goTo(index - 1);
  nextBtn.onclick = () => {
    if(index === TUTORIAL_SLIDES.length - 1){ finish(); }
    else{ goTo(index + 1); }
  };
  document.getElementById('close-tutorial').onclick = finish;
}

function wireOnboarding(){
  document.getElementById('ob-start-btn').onclick = async () => {
    const balance = parseFloat(document.getElementById('ob-balance').value);
    const total = parseFloat(document.getElementById('ob-total').value);

    if(isNaN(balance) || balance < 0){
      await showAlert('Enter your current balance to continue.');
      return;
    }

    const totalBudget = (!isNaN(total) && total > 0) ? total : DEFAULTS.totalBudget;

    /* Spending that happened before you started using the tracker
       (e.g. you're entering this on day 6, not day 1) still counts
       toward total_spent, or available_to_spend would be wrong. */
    const spentBeforeSetup = Math.max(0, totalBudget - balance);

    const budget = makeBudget({
      id:'dining-dollars',
      name:'Dining Dollars',
      totalBudget,
      balance,
      history:[{
        date: todayISO(),
        type:'setup',
        amount: spentBeforeSetup > 0 ? spentBeforeSetup : null,
        category:'other',
        balanceAfter: balance,
        note:'Starting balance entered'
      }]
    });

    config.budgets = [budget];
    config.activeBudgetId = budget.id;
    config.setupComplete = true;

    saveConfig();
    render();

    if(!config.tutorialSeen){
      showTutorial();
    }
  };
}

function historyRowMeta(h){
  if(h.type === 'spend'){
    const meta = CATEGORIES.find(c => c.key === (h.category || 'other')) || CATEGORIES[CATEGORIES.length - 1];
    return { icon: meta.emoji, label: `Purchase −${fmtMoney(h.amount)} · ${meta.label}` };
  }
  if(h.type === 'setup'){
    const label = (typeof h.amount === 'number' && h.amount > 0)
      ? `Starting balance (${fmtMoney(h.amount)} already spent)`
      : 'Starting balance';
    return { icon:'🏁', label };
  }
  return { icon:'🔄', label:'Balance updated' };
}

function overlay(innerHTML){
  const div = document.createElement('div');
  div.className = 'overlay';
  div.innerHTML = `<div class="sheet center">${innerHTML}</div>`;
  div.addEventListener('click', e => { if(e.target === div){ div.remove(); } });
  document.body.appendChild(div);
  return div;
}

function showSpend(){
  const budget = activeBudget();
  const s = computeStats(budget);
  const titleSuffix = config.budgets.length > 1 ? ` · ${escapeHtml(budget.name)}` : '';
  let selectedCategory = 'meal';

  const quickChips = (budget.quickAmounts || DEFAULTS.quickAmounts).map(amt =>
    `<button type="button" class="chip qa-chip" data-amt="${amt}">${fmtMoney(amt).replace(/\.00$/, '')}</button>`
  ).join('');

  const catChips = CATEGORIES.map(c =>
    `<button type="button" class="chip cat-chip${c.key === selectedCategory ? ' active' : ''}" data-cat="${c.key}">${c.emoji} ${c.label}</button>`
  ).join('');

  const ov = overlay(`
    <button class="close-x" id="close-spend">×</button>
    <h2>Log a purchase${titleSuffix}</h2>
    <p class="hint">You currently have <b>${fmtMoney(s.availableToSpend)}</b> available to spend.</p>

    <label>Quick amount</label>
    <div class="chip-row">${quickChips}</div>

    <label>Amount spent</label>
    <input type="number" id="spend-amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" autofocus>

    <label>Category <span class="pro-chip">PRO</span></label>
    <div class="chip-row" id="cat-chip-row">${catChips}</div>

    <div class="sheet-actions">
      <button class="btn btn-secondary" id="cancel-spend">Cancel</button>
      <button class="btn btn-primary" id="confirm-spend">Log it</button>
    </div>
  `);

  ov.querySelectorAll('.qa-chip').forEach(btn => {
    btn.onclick = () => { document.getElementById('spend-amount').value = btn.dataset.amt; };
  });

  ov.querySelectorAll('.cat-chip').forEach(btn => {
    btn.onclick = () => {
      ov.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = btn.dataset.cat;
    };
  });

  document.getElementById('close-spend').onclick = () => ov.remove();
  document.getElementById('cancel-spend').onclick = () => ov.remove();
  document.getElementById('confirm-spend').onclick = async () => {
    const amt = parseFloat(document.getElementById('spend-amount').value);
    if(isNaN(amt) || amt <= 0){ await showAlert('Enter a valid amount.'); return; }

    const currentStats = computeStats(budget);
    if(amt > currentStats.availableToSpend){
      const proceed = await showConfirm(
        `This purchase is ${fmtMoney(amt - currentStats.availableToSpend)} more than your currently earned allowance of ${fmtMoney(currentStats.availableToSpend)}. Continue?`,
        { title:'Over your pace', okLabel:'Log it anyway' }
      );
      if(!proceed){ return; }
    }

    budget.balance = Math.max(0, Number(budget.balance) - amt);
    budget.history.push({ date: todayISO(), type:'spend', amount:amt, category:selectedCategory, balanceAfter: budget.balance });

    saveConfig();
    ov.remove();
    render();
    showToast('Purchase logged');
  };
}

function showInsights(){
  const budget = activeBudget();
  const titleSuffix = config.budgets.length > 1 ? ` · ${escapeHtml(budget.name)}` : '';
  const { s, weekKeys, weekTotals, maxWeek, catEntries, maxCat, projection } = computeInsights(budget);

  const weekRows = weekKeys.length ? weekKeys.map(k => {
    const amt = weekTotals[k];
    const pct = Math.max(4, (amt / maxWeek) * 100);
    return `
      <div class="bar-row">
        <span class="bar-row-label">${fmtDate(k)}</span>
        <div class="bar-track"><div class="bar-track-fill" style="width:${pct}%"></div></div>
        <span class="bar-row-amt">${fmtMoney(amt)}</span>
      </div>`;
  }).join('') : '<div class="empty">Log a few purchases to see weekly trends</div>';

  const catRows = catEntries.length ? catEntries.map(([key, amt]) => {
    const meta = CATEGORIES.find(c => c.key === key) || CATEGORIES[CATEGORIES.length - 1];
    const pct = Math.max(4, (amt / maxCat) * 100);
    const share = s.totalSpent > 0 ? Math.round((amt / s.totalSpent) * 100) : 0;
    return `
      <div class="bar-row">
        <span class="bar-row-label">${meta.emoji} ${meta.label}</span>
        <div class="bar-track"><div class="bar-track-fill" style="width:${pct}%; background:${meta.color};"></div></div>
        <span class="bar-row-amt">${fmtMoney(amt)} · ${share}%</span>
      </div>`;
  }).join('') : '<div class="empty">No categorized purchases yet</div>';

  let projectionHtml;
  if(projection.status === 'none'){
    projectionHtml = `<div class="note">Log some purchases to see your spending projection.</div>`;
  }else if(projection.status === 'good'){
    projectionHtml = `<div class="note" style="background:rgba(46,125,79,.10); color:var(--good);">On pace — projected to finish the semester with about <b>${fmtMoney(Math.max(0, projection.projectedLeftover))}</b> left over.</div>`;
  }else{
    const when = projection.runOutDate ? `around <b>${fmtDate(projection.runOutDate)}</b>` : 'before the semester ends';
    projectionHtml = `<div class="note" style="background:rgba(194,59,34,.10); color:var(--bad);">At your current pace (${fmtMoney(projection.avgPerClassDay)}/class day) you're projected to run out ${when}.</div>`;
  }

  const ov = overlay(`
    <button class="close-x" id="close-insights">×</button>
    <span class="pro-chip">✨ PRO</span>
    <h2 style="margin-top:8px;">Insights${titleSuffix}</h2>
    <p class="hint">A closer look at your spending pace and habits.</p>

    ${projectionHtml}

    <div class="section-title">Weekly spending</div>
    ${weekRows}

    <div class="section-title">By category</div>
    ${catRows}

    <div class="sheet-actions">
      <button class="btn btn-secondary" id="share-card-btn" style="flex:1;">🖼️ Share card</button>
      <button class="btn btn-primary" id="close-insights-2" style="flex:1;">Done</button>
    </div>
  `);

  document.getElementById('close-insights').onclick = () => ov.remove();
  document.getElementById('close-insights-2').onclick = () => ov.remove();
  document.getElementById('share-card-btn').onclick = () => shareBudgetCardImage(budget, s);
}

    <div class="sheet-actions">
      <button class="btn btn-secondary" id="cancel-budget-form">Cancel</button>
      <button class="btn btn-primary" id="save-budget-form">${isNew ? 'Add budget' : 'Save'}</button>
    </div>
    ${(!isNew && config.budgets.length > 1) ? `<button class="link" id="delete-budget-form">Delete this budget</button>` : ''}
  `);

  document.getElementById('close-budget-form').onclick = () => ov.remove();
  document.getElementById('cancel-budget-form').onclick = () => ov.remove();

  document.getElementById('save-budget-form').onclick = async () => {
    const nameRaw = document.getElementById('bf-name').value.trim();
    const totalRaw = parseFloat(document.getElementById('bf-total').value);
    const quickRaw = document.getElementById('bf-quick').value;
    const parsedQuick = quickRaw.split(',').map(v => parseFloat(v.trim())).filter(v => !isNaN(v) && v > 0);
    const quickAmounts = parsedQuick.length ? parsedQuick : [...DEFAULTS.quickAmounts];

    if(isNaN(totalRaw) || totalRaw <= 0){
      await showAlert('Enter a valid total budget.');
      return;
    }

    if(isNew){
      const balanceRaw = parseFloat(document.getElementById('bf-balance').value);
      if(isNaN(balanceRaw) || balanceRaw < 0){
        await showAlert('Enter a starting balance to continue.');
        return;
      }
      const name = nameRaw || `Budget ${config.budgets.length + 1}`;
      const spentBeforeSetup = Math.max(0, totalRaw - balanceRaw);
      const budget = makeBudget({
        name, totalBudget: totalRaw, balance: balanceRaw, quickAmounts,
        history:[{
          date: todayISO(), type:'setup',
          amount: spentBeforeSetup > 0 ? spentBeforeSetup : null,
          category:'other', balanceAfter: balanceRaw, note:'Starting balance entered'
        }]
      });
      config.budgets.push(budget);
      config.activeBudgetId = budget.id;
      saveConfig();
      document.querySelectorAll('.overlay').forEach(o => o.remove());
      render();
      showToast('Budget added');
    }else{
      existing.name = nameRaw || existing.name;
      existing.totalBudget = totalRaw;
      existing.quickAmounts = quickAmounts;
      saveConfig();
      document.querySelectorAll('.overlay').forEach(o => o.remove());
      render();
      showToast('Budget updated');
    }
  };

  const deleteBtn = document.getElementById('delete-budget-form');
  if(deleteBtn){
    deleteBtn.onclick = async () => {
      const ok = await showConfirm(
        `This deletes "${existing.name}" and its entire history. This cannot be undone.`,
        { title:'Delete this budget?', okLabel:'Delete', danger:true }
      );
      if(!ok) return;

      config.budgets = config.budgets.filter(b => b.id !== existing.id);
      if(!config.budgets.length){
        config.budgets = [makeBudget({ id:'dining-dollars', name:'Dining Dollars' })];
      }
      if(config.activeBudgetId === existing.id){
        config.activeBudgetId = config.budgets[0].id;
      }
      saveConfig();
      document.querySelectorAll('.overlay').forEach(o => o.remove());
      render();
      showToast('Budget deleted');
    };
  }
}

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline caching is a nice-to-have */ });
  });
}

(function init(){
  loadState();
  render();
})();
</script>

</body>
